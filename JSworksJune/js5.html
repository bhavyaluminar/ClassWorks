<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script>

function check(){
    var fruit=document.getElementById('f').value;

    switch(fruit){
        case 'banana':
            price=100;
            break;
        case 'orange':
            price=150;
            break;
        case 'apple':
            price=200;
            break;
        default:
            price="No fruit";
            break;
    }
    document.getElementById('r').value=price;





}

    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body>
<div class="container w-25 p-5 mt-5 border border-2 border-primary">
<div class="mb-3">
       <h3 class="text-center text-danger">Check Price App</h3>
    </div>
     <div class="mt-4">
         <label class="form-label fs-5 text-primary">Fruitname:</label>
        <select id="f">
            <option value="banana">Banana</option>
            <option value="orange">Orange</option>
            <option value="apple">Apple</option>
        </select>
    </div>
     <div class="mt-4 d-flex justify-content-evenly">
        <input type="button" onclick="check()" class="btn btn-danger"  value="Check">
 <input type="text" id="r">
    </div>


</div>

</body>
</html>
