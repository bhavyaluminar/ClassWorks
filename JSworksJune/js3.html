<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <script>
      var count=0;

      function increment(){

          count++;
          document.getElementById('h').innerHTML=count;
      }
      function decrement(){
          count--;
          document.getElementById('h').innerHTML=count;
      }
      function reset(){
         count=0;
          document.getElementById('h').innerHTML=count;
      }
  </script>




</head>

<body>

<div class="container w-25 p-5 mt-5 border border-3 border-danger">
    <div class="mb-3">
       <h2 class="text-center text-danger">Counter App</h2>
    </div>
     <div class="mb-3">
       <h2 class="text-center text-primary" id="h">0</h2>
    </div>

    <div class="mb-3">
       <p class="text-center text-primary">Click button to Count</p>
    </div>
    <div class="mb-3 d-flex justify-content-between">
        <input type="button" onclick="increment()" id="i" class="btn btn-success"  value="+">
        <input type="button" onclick="decrement()" id="d" class="btn btn-danger"  value="-">
    </div>
    <div class="mt-5 text-center">
        <input type="button" onclick="reset()" class="btn btn-warning" value="Reset">
    </div>




</div>
</body>
</html>
