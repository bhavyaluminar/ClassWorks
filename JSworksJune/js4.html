<!DOCTYPE html>
<html lang="en">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function Add(){

            var n1=document.getElementById('n1').value;
            var n2=document.getElementById('n2').value;
            var s=Number(n1)+Number(n2);
            document.getElementById('r').innerHTML=s;
        }
    </script>

    
</head>
<body class="bg-secondary">
    <div class="container w-25 p-5 border border-2 shadow mt-5 text-light">

      <div id="div1" class="mb-3 text-center">
        <h2>Arithmetic Operations</h2>
       
      </div>
      <div id="div2" class="mb-5 text-center">
        <input type="number" id="n1" class="form-control" placeholder="Number">
      </div>
       <div id="div2" class="mb-5 text-center">
        <input type="number" id="n2" class="form-control" placeholder="Number">
      </div>
      <div id="div3" class="mb-3 d-flex justify-content-between">
        <button class="btn btn-light btn-lg" onclick="Add()">+</button>
         <button class="btn btn-light btn-lg" onclick="Sub()">-</button>
         <button class="btn btn-light btn-lg" onclick="Mul()">*</button>
      </div>
      <div id="div4" class="mb-3 mt-5 text-center">
        <h2 id="r">Result</h2>
        
         
</div>

    </div>
    

</body>
</html>
