<!DOCTYPE html>
{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container p-5 mt-5 text-light w-50 border border-2 shadow ">
  <h3 class="text-center">School List</h3>
  <ol class="fs-4">
    {% for i in schools %}
    <li><a href="{% url 'schooldetail' i.id %}">{{i.name}}</a></li>
    {% endfor %}
  </ol>

</div>
{% endblock %}
