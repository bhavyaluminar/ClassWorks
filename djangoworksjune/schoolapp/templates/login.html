<!DOCTYPE html>
{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container p-5 mt-5 text-light w-50 border border-2 shadow text-center">
  <h3>Login</h3>
  <form method="POST">
    {% csrf_token %}
    {{form|crispy}}
    <div class="mb-3">
    <input type="submit" class="btn btn-light">
      </div>
  </form>
</div>
{% endblock %}
