{% extends 'base.html' %}
{% block content %}
<div class="container w-50 mt-5 p-5">
<h3 class="text-center mt-3">Search Results</h3>
    {% if books %}
<table class="table table-bordered text-center">
    <tr>
         <th>Image</th>
        <th>Title</th>
        <th>Author</th>
        <th>Price</th>
        <th>Pages</th>
        <th>Language</th>


    </tr>
    {% for i in books %}
    <tr>
        <td><img src="{{i.image.url}}" height="100px" width="100px"></td>
        <td>{{i.title}}</td>
        <td>{{i.author}}</td>
        <td>{{i.price}}</td>
        <td>{{i.pages}}</td>
        <td>{{i.language}}</td>


    </tr>
{% endfor %}
</table>
    {% else %}
    <h2>No Results</h2>
    {% endif %}
</div>

{% endblock %}
