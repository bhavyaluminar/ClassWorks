{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container mt-5 p-5 w-50 border border-2 border-light">
  <h3 class="text-center">Factorial</h3>


<form method="post">
  {% csrf_token %}
    {{form|crispy}}
  <div class="mb-3 mt-3">
    <input type="submit"  class="btn btn-light">
  </div>

</form>

  {% if result %}
  <h4>Factorial is :{{result}}</h4>
  {% endif %}
</div>
{% endblock %}
