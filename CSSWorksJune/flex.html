<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
  <style>
  .parent{
display:flex; /*align child elements horizontally*/
justify-content:center;       /*flex-start,flex-end,center,space-evenly,space-between,space-around */

align-items:center;        /*center,flex-start,flex-end*/
width:90%;
height:500px;
margin:auto;         /* centrally align the parent div */
  border:1px solid red;
}
    .child1{
    width:30%;;
    height:200px;
    border:1px solid blue;
    }
  </style>
</head>
<body>

<h1>DISPLAY FLEX</h1>
<div class="parent">
  <div class="child1">DIV1</div>
  <div class="child1">DIV2</div>
  <div class="child1">DIV3</div>
</div>
</body>
</html>
